name: DockerHub CI

# TAGs are exact version, includes base image (alpine) + app, ex: java/25.0.1-alpine3.23
# Branches are symlinks, includes app only, ex: java/25.0.1, java/25 etc... they are updated so prefer to use a sha256 ref to pin it
on:
  push:
    branches:
      - '*/[0-9]+.[0-9]+'
      - '*/[0-9]+.[0-9]+.[0-9]+'
    tags:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#filter-pattern-cheat-sheet
      - '*/[0-9]+.[0-9]+-alpine[0-9]+'
      - '*/[0-9]+.[0-9]+.[0-9]+-alpine[0-9]+'
      - '*/[0-9]+.[0-9]+-alpine[0-9]+.[0-9]+'
      - '*/[0-9]+.[0-9]+.[0-9]+-alpine[0-9]+.[0-9]+'
      - '*/[0-9]+.[0-9]+-alpine[0-9]+.[0-9]+.[0-9]+'
      - '*/[0-9]+.[0-9]+.[0-9]+-alpine[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/java/') && !startsWith(github.ref, 'refs/heads/java/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Parsed tag
        id: parsed_tag
        shell: bash
        run: |
          name=${GITHUB_REF#refs/*/}
          image=${name%%/*}
          version=${name#*/}
          if [[ ! "$image" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ||
                ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}(-alpine[0-9]+(\.[0-9]+){0,2})?$ ]]; then
            echo "Invalid image/version ref: $GITHUB_REF" >&2
            exit 1
          fi
          printf 'image=%s\nversion=%s\n' "$image" "$version" >> "$GITHUB_OUTPUT"
          printf 'Image=%s,Version=%s\n' "$image" "$version"

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith( github.ref, 'refs/tags/') || startsWith( github.ref, 'refs/heads/')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: startsWith( github.ref, 'refs/tags/') || startsWith( github.ref, 'refs/heads/')
        with:
          push: true
          context: ./${{ steps.parsed_tag.outputs.image }}
          file: ./${{ steps.parsed_tag.outputs.image }}/Dockerfile
          tags: ossyupiik/${{ steps.parsed_tag.outputs.image }}:${{ steps.parsed_tag.outputs.version }}
          labels: |
            org.opencontainers.image.vendor=Yupiik

      - name: Image Report
        env:
          IMAGE: ${{ steps.parsed_tag.outputs.image }}
          VERSION: ${{ steps.parsed_tag.outputs.version }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: printf 'ossyupiik/%s:%s@%s\n' "$IMAGE" "$VERSION" "$DIGEST"

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if ! gh release view "$tag" > /dev/null; then
            # Recheck after a failed create to tolerate concurrent runs or a lost response.
            gh release create "$tag" --verify-tag --title "Release $tag" --notes '' ||
              gh release view "$tag" > /dev/null
          fi
