name: Zulu Java Docker CLI

on:
  pull_request:
    paths:
      - 'java-docker-zulu/**'
      - '.github/workflows/java-docker-zulu.yml'
  push:
    branches: [main]
    paths:
      - 'java-docker-zulu/**'
      - '.github/workflows/java-docker-zulu.yml'
    # Separate from the Alpine image and the legacy DockerHub CI patterns.
    tags: ['java-docker-zulu/*-docker*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: ./java-docker-zulu
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: java-docker-zulu:smoke
      - name: Test secure filesystem, non-root read-only runtime and HTTPS trust
        env:
          SMOKE_HTTPS_URL: https://example.com
        run: java java-docker-zulu/test/SmokeTest.java java-docker-zulu:smoke '${{ matrix.architecture }}'

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.repository == 'yupiik/dockerhub-java' && startsWith(github.ref, 'refs/tags/java-docker-zulu/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require merged release commit and validate image tag
        id: tag
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Release tags must point to a commit merged into main.' >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#java-docker-zulu/}
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,4}-debian[0-9]+-docker[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected java-docker-zulu/JAVA-debianMAJOR-dockerDOCKER_VERSION' >&2
            exit 1
          fi
          if [[ "$version" != "$(cat java-docker-zulu/release-version)" ]]; then
            echo 'Release tag does not match java-docker-zulu/release-version.' >&2
            exit 1
          fi
          echo "image=ossyupiik/java-docker:${version/-/-zulu-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform index
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./java-docker-zulu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          provenance: mode=max
          sbom: true
      - name: Image report
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
