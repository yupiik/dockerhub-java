name: Java Docker CLI

on:
  pull_request:
    paths:
      - 'java-docker/**'
      - '.github/workflows/java-docker.yml'
  push:
    branches: [main]
    paths:
      - 'java-docker/**'
      - '.github/workflows/java-docker.yml'
    # The Docker suffix avoids the legacy DockerHub CI tag patterns.
    tags: ['java-docker/*-docker*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, zulu]
        architecture: [amd64, arm64]
        include:
          - runner: ubuntu-26.04
            architecture: amd64
          - runner: ubuntu-26.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./java-docker
          platforms: linux/${{ matrix.architecture }}
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          tags: java-docker:smoke
      - name: Test secure filesystem, non-root read-only runtime and HTTPS trust
        env:
          SMOKE_HTTPS_URL: https://example.com
        run: java java-docker/test/SmokeTest.java java-docker:smoke '${{ matrix.architecture }}' '${{ matrix.variant }}'

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.repository == 'yupiik/dockerhub-java' && startsWith(github.ref, 'refs/tags/java-docker/')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require merged release commit and validate image tag
        id: tag
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Release tags must point to a commit merged into main.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^java-docker/[0-9]+\.[0-9]+\.[0-9]+-alpine[0-9]+\.[0-9]+-docker[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            variant=alpine
          elif [[ "$GITHUB_REF_NAME" =~ ^java-docker/[0-9]+(\.[0-9]+){2,4}-zulu-debian[0-9]+-docker[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            variant=zulu
          else
            echo 'Expected java-docker/JAVA-alpineMAJOR.MINOR-dockerDOCKER_VERSION or java-docker/JAVA-zulu-debianMAJOR-dockerDOCKER_VERSION.' >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#java-docker/}
          printf 'variant=%s\nimage=ossyupiik/java-docker:%s\n' "$variant" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: steps.tag.outputs.variant == 'zulu'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform index
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./java-docker
          platforms: linux/amd64,linux/arm64
          build-args: VARIANT=${{ steps.tag.outputs.variant }}
          push: true
          tags: ${{ steps.tag.outputs.image }}
          provenance: mode=max
          sbom: true
      - name: Image report
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
